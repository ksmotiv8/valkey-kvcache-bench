# Tier C - remote Valkey only. Local tiers off so reuse must hit the network.
#
# Used by benchmarks/bench_corpus_e2e.py --backend valkey (Scenario 12).
# Launch vLLM with:
#   LMCACHE_CONFIG_FILE=benchmarks/configs/valkey_tier.yaml \
#   vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ --port 8000 \
#       --no-enable-prefix-caching \
#       --kv-transfer-config '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'

chunk_size: 256
# The default 'builtin' hash is Python's hash(), salted per process, so two
# nodes derive different keys for the same tokens and a shared tier can never
# hit. Required for the fleet run; harmless on one node.
pre_caching_hash_algorithm: sha256_cbor_64bit
local_cpu: false
max_local_disk_size: 0.0
remote_url: "valkey://VALKEY_HOST:6379"
remote_serde: "naive"
extra_config:
  valkey_num_workers: 8

# Exposes lmcache:num_hit_tokens on :6999 for the harness's reuse check.
internal_api_server_enabled: true
